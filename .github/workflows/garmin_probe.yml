name: Probe Garmin training status

# A one off diagnostic: it asks the Garmin training status services what they
# hold and commits the answer back, so the real sync script can be written
# against the fields the account really has.

on:
  push:
    branches: [master]
    paths:
      - 'run_page/garmin_probe.py'
      - '.github/workflows/garmin_probe.yml'
  workflow_dispatch:

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ask the Garmin training status services
        run: python run_page/garmin_probe.py ${{ secrets.GARMIN_SECRET_STRING_CN }} --is-cn

      - name: Commit the report
        run: |
          git add run_page/garmin_probe_report.json
          if git diff --cached --quiet; then
            echo "no report to commit"
          else
            git -c user.name="GitHub Action" -c user.email="action@github.com" commit -m "Record the Garmin training status probe"
            git pull --rebase origin master || echo "could not rebase the report"
            git push || echo "could not push the report"
          fi
