name: ITRA Probe

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/itra_probe.yml

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show the runner
        run: |
          node --version || true
          google-chrome --version || chromium --version || true
          which xvfb-run || true

      - name: Open the runner space with a headed browser
        run: |
          xvfb-run -a google-chrome --no-sandbox --disable-gpu \
            --remote-debugging-port=9222 --user-data-dir=/tmp/itraprobe \
            "https://itra.run/RunnerSpace/gao.hao.4683832" >/tmp/chrome.log 2>&1 &
          sleep 30
          curl -s http://127.0.0.1:9222/json/list > /tmp/targets.json || true
          cat /tmp/targets.json
          echo "--- chrome log ---"
          tail -20 /tmp/chrome.log || true
