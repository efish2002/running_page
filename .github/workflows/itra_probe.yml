name: ITRA Probe

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/itra_probe.yml

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show the runner
        run: |
          node --version
          google-chrome --version
          which xvfb-run
          echo "DISPLAY=[$DISPLAY]"

      - name: Check that a browser can draw
        run: |
          xvfb-run -a google-chrome --headless=new --no-sandbox --disable-gpu \
            --dump-dom "https://example.com" 2>/tmp/chrome.log | head -5
          echo "--- chrome log ---"
          tail -5 /tmp/chrome.log

      - name: Read the itra pages with the browser
        run: |
          node run_page/itra_browser.mjs /tmp/pages \
            table "https://itra.run/RunnerSpace/GetLatestRaceResultByYear?runnerId=4683832&raceyear=&categoryId=" table-body-row \
            space "https://itra.run/RunnerSpace/gao.hao.4683832" "ITRA ID" || true
          ls -l /tmp/pages || true
